name: Fee Deadlines Scraper

on:
  schedule:
    - cron: '0 8 * * *'  # once daily at 8am UTC
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Write Firebase service account key
        run: echo '${{ secrets.FIREBASE_KEY }}' > serviceAccountKey.json

      - name: Run fee deadlines scraper
        run: node scrapers/fee-deadlines.js

      - name: Clean up key
        run: rm serviceAccountKey.json
