name: Scrape UPSA News & Opinions

on:
  schedule:
    - cron: '0 6,12,18 * * *'   # Runs at 6am, 12pm, 6pm UTC daily
  workflow_dispatch:              # Also allows manual trigger from GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Write Firebase service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > serviceAccountKey.json

      - name: Run news & opinions scraper
        run: node scrapers/news-opinions.js

      - name: Clean up service account key
        if: always()
        run: rm -f serviceAccountKey.json
