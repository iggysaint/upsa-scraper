name: UPSA Announcements Scraper

on:
  schedule:
    - cron: '0 */6 * * *'  # runs every 6 hours
  workflow_dispatch:         # lets you run it manually from GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Write Firebase service account key
        run: echo '${{ secrets.FIREBASE_KEY }}' > serviceAccountKey.json

      - name: Run scraper
        run: node scraper.js

      - name: Clean up key
        run: rm serviceAccountKey.json
